<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWL Systems</title>

  <!-- Font moderne -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at top, #1a2a3a, #0b0f14);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      font-size: 60px;
      letter-spacing: 5px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.7;
      font-size: 18px;
    }

    .btn {
      margin-top: 30px;
      padding: 12px 30px;
      border: 2px solid #00c3ff;
      color: #00c3ff;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00c3ff;
      color: black;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 14px;
      opacity: 0.6;
    }

    @media(max-width:600px){
      h1{
        font-size: 35px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>OWL SYSTEMS</h1>
    <p>Solutions digitales & développement</p>

    <a class="btn" href="https://owlsys.net" target="_blank">
      Accéder au site
    </a>
  </div>

  <div class="footer">
    owlsys.net
  </div>

</body>
</html>
