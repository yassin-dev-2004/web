<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWL Systems</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at center, #1c2b3a, #0a0f14);
      color: white;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      padding: 50px;
    }

    .left img {
      width: 400px;
      max-width: 100%;
      filter: drop-shadow(0 0 20px red);
    }

    .right {
      text-align: right;
    }

    h1 {
      font-size: 60px;
      margin: 0;
    }

    h2 {
      margin: 0;
      opacity: 0.7;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 30px;
      border: 2px solid #00c3ff;
      color: #00c3ff;
      text-decoration: none;
      display: inline-block;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00c3ff;
      color: black;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      right: 30px;
      opacity: 0.5;
    }

    @media(max-width:900px){
      .container{
        flex-direction: column;
        text-align: center;
      }
      .right{
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left">
      <img src="owl.png" alt="owl">
    </div>

    <div class="right">
      <h1>OWL</h1>
      <h2>SYSTEMS</h2>

      <a class="btn" href="https://github.com/yassin-dev-2004" target="_blank">
        Accéder au site
      </a>
    </div>

  </div>

  <div class="footer">
    owlsys.net
  </div>

</body>
</html>
