<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWL Systems</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at center, #1c2b3a, #0a0f14);
      color: white;
      overflow: hidden;
    }

    .container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 🦉 IMAGE À GAUCHE */
    .left {
      position: absolute;
      left: 0;
      bottom: 0;
    }

    .left img {
      height: 95vh;
      filter: drop-shadow(0 0 30px red);
    }

    /* 🧠 TEXTE CENTRÉ */
    .center {
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 70px;
      margin: 0;
      letter-spacing: 6px;
    }

    h2 {
      margin: 0;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    /* 🔘 BOUTON */
    .btn {
      margin-top: 25px;
      padding: 12px 30px;
      border: 2px solid #00c3ff;
      color: #00c3ff;
      text-decoration: none;
      display: inline-block;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00c3ff;
      color: black;
      box-shadow: 0 0 15px #00c3ff;
    }

    /* 🔻 FOOTER */
    .footer {
      position: absolute;
      bottom: 20px;
      right: 30px;
      opacity: 0.5;
      font-size: 14px;
    }

    /* 📱 RESPONSIVE */
    @media(max-width:900px){
      .left img{
        height: 50vh;
      }

      h1{
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 🦉 IMAGE -->
    <div class="left">
      <img src="owl.png" alt="owl">
    </div>

    <!-- 🧠 TEXTE -->
    <div class="center">
      <h1>OWL</h1>
      <h2>SYSTEMS</h2>

      <a class="btn" href="https://www.owl-systems.com/" target="_blank">
        Accéder au site
      </a>
    </div>

  </div>

  <div class="footer">
    owlsys.net
  </div>

</body>
</html>
