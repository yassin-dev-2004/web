<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWL Systems</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at center, #1c2b3a, #0a0f14);
      color: white;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 60px;
      padding: 20px;
    }

    .left img {
      width: 400px;
      max-width: 100%;
      filter: drop-shadow(0 0 25px red);
    }

    .right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 60px;
      margin: 0;
      letter-spacing: 5px;
    }

    h2 {
      margin: 0;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    .btn {
      margin-top: 25px;
      padding: 12px 30px;
      border: 2px solid #00c3ff;
      color: #00c3ff;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00c3ff;
      color: black;
      box-shadow: 0 0 15px #00c3ff;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      right: 30px;
      opacity: 0.5;
      font-size: 14px;
    }

    @media(max-width:900px){
      .container{
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left">
      <img src="owl.png" alt="owl">
    </div>

    <div class="right">
      <h1>OWL</h1>
      <h2>SYSTEMS</h2>

      <a class="btn" href="https://www.owl-systems.com/" target="_blank">
        Accéder au site
      </a>
    </div>

  </div>

  <div class="footer">
    owlsys.net
  </div>

</body>
</html>
